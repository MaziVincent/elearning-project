<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Form</title>
    <script type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>
<style>
    #emailForm{
        margin-bottom: 10px;
    }
    #form-content{
        display: grid;
        grid-template-columns: auto auto;
        gap: 1rem;
        margin-bottom: 10px;
    }
    #container{
        display: flex;
        flex-direction: column;
    }
    #container label{
        margin-bottom: 4px;
        font-weight: 500;
        font-family: Arial, Helvetica, sans-serif;
    }
    #container input{
        border: none;
        padding: 20px 5px;
        font-family: Arial, Helvetica, sans-serif;
        /* background-color: #e1e0e09a; */
        border-bottom: 1px solid #ddd;
        &:focus{
            outline-width: 0px;
            outline-color: #ddd;
            border-bottom: 1px solid #7466f7;
        }
    }
    #comment{
        display: flex;
        flex-direction: column;
    }
    #comment label{
        margin-bottom: 4px;
        font-weight: 500;
        font-family: Arial, Helvetica, sans-serif;
    }
    #comment textarea{
        border: none;
        padding: 5px 5px;
        font-family: Arial, Helvetica, sans-serif;
        /* background-color: #e1e0e09a; */
        border-bottom: 1px solid #ddd;
        &:focus{
            outline-width: 0px;
            outline-color: #ddd;
            border-bottom: 1px solid #7466f7;
        }
    }
    @media (max-width: 780px) {
        #form-content{
            grid-template-columns: auto;
        }
    }
    #emailForm button{
        display: flex;
        justify-self: right;
        margin: 20px 0;
        background: #313e3b;
        color: white;
        padding: 16px;
        border-radius: 10px;
    }
</style>
</head>
<body>
    <h1>Contact Us</h1>
    <form id="emailForm">
        <div id="form-content">
            <div id="container" style="display: flex; flex-direction: column;">
                <label for="name">YOUR FULL NAME*</label>
                <input type="text" id="name" name="name" placeholder="Entter your full name" required>
            </div>
            <div id="container">
                <label for="email">YOUR EMAIL*</label>
                <input type="email" id="email" name="email" placeholder="Entter your email" required>
            </div>
            <div id="container" style="display: flex; flex-direction: column;">
                <label for="phone">YOUR PHONE NUMBER*</label>
                <input type="tel" id="phone" name="phone" placeholder="Entter your phone number" required>
            </div>
            <div id="container">
                <label for="subject">YOUR SUBJECT</label>
                <input type="text" id="subject" name="subject" placeholder="Entter your preffered subject">
            </div>
            <div id="comment">
                <label for="comment">YOUR COMMENT</label>
                <textarea rows="8" name="message" id="message" placeholder="Enter your comment here"></textarea>
            </div>
        </div>
        <button class="btn btn-large btn-dark-gray btn-rounded btn-box-shadow btn-switch-text left-icon submit" type="submit">
            <span>
                <span><i class="fa-regular fa-paper-plane"></i></span>
                <span class="btn-double-text" data-text="Send message">Send message</span>
            </span>
        </button>
    </form>
    <script src="js/email.js"></script>
    <script>
        

        // Handle form submission
        const form = document.getElementById('emailForm');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const formData = {
                name: form.name.value,
                email: form.email.value,
                phone: form.phone.value,
                subject: form.subject.value,
                // message: form.message.value
            };

            try {
                const response = await sendEmail(formData);
                alert('Email sent successfully!');
                console.log(response);
            } catch (error) {
                alert('Failed to send email.');
                console.error(error);
            }
        });
    </script>
</body>
</html>
